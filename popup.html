<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Highlight Note</title>
  <link rel="stylesheet" href="popup.css" />
  <script src="theme-init.js"></script>
</head>
<body>
  <div class="header">
    <div class="brand">
      <img src="icons/icon48.png" alt="" class="brand-logo" />
      <h1>Highlight Note</h1>
    </div>
    <div class="header-right">
      <button class="hd-btn" id="syncBtn" title="Đồng bộ qua Google Drive" aria-label="Đồng bộ qua Google Drive" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H7a5 5 0 1 1 1.02-9.9A6 6 0 0 1 19.5 11 4 4 0 0 1 17.5 19z"></path></svg>
        <span class="hd-dot" hidden></span>
      </button>
      <button class="hd-btn" id="themeBtn" title="Đổi giao diện Sáng / Tối" aria-label="Đổi giao diện Sáng / Tối"></button>
      <button class="hd-btn" id="optionsBtn" title="Cài đặt" aria-label="Cài đặt">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      </button>
      <label class="switch" id="enabledSwitch" title="Bật/tắt tô sáng trên mọi trang">
        <input type="checkbox" id="enabledToggle" aria-label="Bật/tắt tô sáng trên mọi trang" />
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="review-bar" id="reviewBar" hidden></div>
  <div class="backup-banner" id="backupBanner" hidden></div>

  <div class="search-bar">
    <div class="search-field">
      <svg class="search-ico" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input type="search" id="searchInput" placeholder="Tìm từ, nghĩa, ghi chú, #tag…" autocomplete="off" />
    </div>
    <div class="sort-wrap" title="Sắp xếp">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h13M3 12h9M3 18h5"></path><path d="M18 8v12M15 17l3 3 3-3"></path></svg>
      <select id="sortSel" aria-label="Sắp xếp">
        <option value="newest">Mới thêm</option>
        <option value="oldest">Cũ nhất</option>
        <option value="alpha">A → Z</option>
        <option value="closest">Sắp thuộc</option>
        <option value="hoverDesc">Gặp nhiều</option>
        <option value="hoverAsc">Gặp ít</option>
      </select>
    </div>
  </div>

  <div class="chip-row" id="chipRow"></div>
  <div class="chip-row tag-row" id="tagBar" hidden></div>

  <div class="list" id="list" tabindex="-1"></div>

  <div class="site-bar" id="siteBar" hidden></div>

  <div class="footer">
    <button id="openAddBtn" class="btn-main">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      Thêm mục
    </button>
    <button id="quizBtn" class="btn-soft" title="Ôn tập từ vựng (thẻ ghi nhớ)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
      Ôn tập
    </button>
    <button id="windowBtn" class="btn-icon" title="Mở ở Side Panel — bảng đứng yên cạnh trang (Alt+Shift+S)" aria-label="Mở ở Side Panel">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><line x1="15" y1="3" x2="15" y2="21"></line></svg>
    </button>
    <div class="menu-wrap">
      <button id="moreBtn" class="btn-icon" title="Thêm" aria-label="Thêm" aria-haspopup="menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.9"></circle><circle cx="12" cy="12" r="1.9"></circle><circle cx="19" cy="12" r="1.9"></circle></svg>
      </button>
      <div class="menu" id="moreMenu" role="menu" hidden>
        <button role="menuitem" data-act="rescan">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
          Quét lại trang này
        </button>
        <button role="menuitem" data-act="bulk">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
          Thêm nhiều dòng cùng lúc
        </button>
        <div class="menu-sep"></div>
        <button role="menuitem" data-act="export">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          Tải file backup (.json)
        </button>
        <button role="menuitem" data-act="exportMd">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="8" y1="13" x2="16" y2="13"></line><line x1="8" y1="17" x2="13" y2="17"></line></svg>
          Xuất Markdown (Obsidian, Notion)
        </button>
        <button role="menuitem" data-act="import">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
          Nhập từ file backup…
        </button>
        <div class="menu-sep"></div>
        <button role="menuitemcheckbox" data-act="learning" id="learningItem" aria-checked="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10 12 5 2 10l10 5 10-5z"></path><path d="M6 12v5c0 1 2.7 3 6 3s6-2 6-3v-5"></path></svg>
          <span class="mi-text">Chế độ học từ<small id="learningState"></small></span>
          <span class="mi-switch" aria-hidden="true"></span>
        </button>
        <button role="menuitem" data-act="help">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
          Hướng dẫn &amp; phím tắt
        </button>
      </div>
    </div>
  </div>

  <!-- Màn hình Thêm mục (phủ toàn bộ popup) -->
  <div class="add-screen" id="addScreen" hidden>
    <div class="add-head">
      <button class="add-back" id="addBack" title="Quay lại danh sách (Esc)" aria-label="Quay lại danh sách">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>
      <h2>Thêm mục mới</h2>
    </div>
    <div class="add-body">
      <label class="add-flabel" for="termInput">Từ / cụm từ / đoạn</label>
      <textarea id="termInput" rows="1" placeholder="vd: serendipity, deadline dự án, câu cần ghi nhớ…"></textarea>

      <div class="add-flabel">Loại mục</div>
      <div class="type-picker" id="typePicker"></div>
      <div class="type-hint" id="typeHint"></div>

      <label class="add-flabel" for="meaningInput">Nghĩa / mô tả <span class="opt" id="meaningHint"></span></label>
      <textarea id="meaningInput" rows="1" placeholder="Gõ từ ở trên — nghĩa sẽ tự dịch"></textarea>

      <label class="add-flabel" for="noteInput">Ghi chú <span class="opt">· tuỳ chọn</span></label>
      <input type="text" id="noteInput" placeholder="Ví dụ, ngữ cảnh, nguồn…" />

      <label class="add-flabel" for="tagsInput">Tag <span class="opt">· tuỳ chọn</span></label>
      <input type="text" id="tagsInput" placeholder="dự-án-A, IELTS… (cách nhau bởi dấu phẩy)" list="tagSuggest" />
      <datalist id="tagSuggest"></datalist>

      <button type="button" class="bulk-link" id="bulkBtn" title="Dán nhiều dòng, thêm cùng lúc">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
        Thêm nhiều dòng cùng lúc
      </button>
    </div>
    <div class="add-foot">
      <span class="kbd-hint"><kbd>Ctrl</kbd>+<kbd>Enter</kbd> để thêm</span>
      <button id="addBtn" class="btn-main">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        Thêm vào danh sách
      </button>
    </div>
  </div>

  <!-- Hộp thoại xác nhận (đồng bộ…) -->
  <div class="modal-overlay" id="dlg" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
      <h3 id="dlgTitle"></h3>
      <div class="dlg-body" id="dlgBody"></div>
      <div class="actions dlg-acts" id="dlgActs"></div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="popup-toast" role="status" aria-live="polite" hidden>
    <span class="toast-text"></span>
    <button class="toast-act" hidden></button>
  </div>

  <!-- Bulk add modal -->
  <div class="modal-overlay" id="bulkModal" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <h3>Thêm nhiều mục cùng lúc</h3>
      <p class="hint">Mỗi dòng 1 mục: <code>từ - nghĩa - ghi chú</code> hoặc chỉ <code>từ</code>. Dán thẳng từ Excel/Sheets (cột cách nhau bằng Tab) cũng được.</p>
      <textarea id="bulkText" rows="9" placeholder="ubiquitous - có mặt khắp nơi&#10;serendipity - may mắn tình cờ - hay dùng trong văn nói&#10;ephemeral"></textarea>
      <div class="bulk-preview" id="bulkPreview"></div>
      <div class="actions">
        <button id="bulkCancel" class="btn-cancel">Huỷ</button>
        <button id="bulkSave" class="btn-primary">Thêm tất cả</button>
      </div>
    </div>
  </div>

  <!-- Ôn tập -->
  <div class="modal-overlay" id="quizModal" hidden>
    <div class="modal quiz" role="dialog" aria-modal="true" aria-label="Ôn tập">
      <button class="quiz-x" id="quizX" title="Đóng (Esc)" aria-label="Đóng">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
      <h3>Ôn tập</h3>
      <div class="quiz-progress"><div class="quiz-bar"><i id="quizBar"></i></div><span id="quizProgress"></span></div>
      <div class="quiz-card" id="quizCard" tabindex="0"></div>
      <div class="actions" id="quizActions"></div>
      <div class="quiz-keys" id="quizKeys"></div>
    </div>
  </div>

  <script src="constants.js"></script>
  <script src="popup.js"></script>
</body>
</html>
